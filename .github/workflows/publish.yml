name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Deliberately resolves ontodag from PyPI rather than from git main: this
      # job gates a real release, so it must exercise what `pip install
      # ontodag-fs` actually gives a user. 0.0.1 shipped importing
      # ontodag.eager, which the released ontodag did not contain — a gate on
      # PyPI-resolved deps is what would have caught it.
      - run: pip install -e ".[dev]"
      # addopts in pyproject.toml excludes the `fuse` marker, so libfuse is
      # not needed here; FUSE integration tests run locally with `pytest -m fuse`.
      - run: pytest
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
