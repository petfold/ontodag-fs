[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontodag-fs"
version = "0.0.2"
description = "Stateless fsspec adapter presenting an OntoDAG concept lattice as a browsable filesystem, with bytes on Ethereum Swarm via swarmfs."
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["swarm", "ethereum", "web3", "bee", "fsspec", "fuse", "filesystem", "ontology", "concept-lattice", "semantic-filesystem", "fca", "formal-concept-analysis", "formal concept analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fsspec",
    "ontodag",
    "swarmfs",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
]
dev = ["ontodag-fs[test]"] # back-compat alias; [test] is the stack-wide name

[project.entry-points."fsspec.specs"]
ontodag = "ontodag_fs.fs:OntoDAGFileSystem"

[project.scripts]
odag-fs = "ontodag_fs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fuse: FUSE integration tests (require libfuse; skipped by default)",
]
addopts = "-m 'not fuse'"

[project.urls]
Homepage = "https://github.com/petfold/ontodag-fs"
Repository = "https://github.com/petfold/ontodag-fs"
Issues = "https://github.com/petfold/ontodag-fs/issues"
