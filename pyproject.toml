[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontodag-fs"
version = "0.1.0"
description = "Stateless fsspec adapter presenting an OntoDAG concept lattice as a browsable filesystem, with bytes on Ethereum Swarm via swarmfs."
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["swarm", "ethereum", "web3", "bee", "fsspec", "fuse", "filesystem", "ontology", "concept-lattice", "semantic-filesystem", "fca", "formal-concept-analysis", "formal concept analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fsspec",
    # 0.11.0 is the floor, not 0.4.0 (which shipped parametric dimensions).
    # Two reasons, both load-bearing here. Registry 3.0/4.0 changed canonical
    # value names from integers in base units to reduced rationals of the SI
    # anchor, so `weight(3kg)` is now canonical and `weight(4.5kg)` stores as
    # `weight(9/2kg)` — against an older ontodag every typed-value path would
    # resolve to a different node. And 0.11.0 is where the native `.od` store
    # began persisting node metadata: before it, a file-backed store lost the
    # object marks and display labels this adapter keeps there, and presented
    # as an empty filesystem (tests/test_file_store.py).
    "ontodag>=0.11.0",
    "swarmfs>=0.4.0",  # _read_reference / reader.bytes_size, the raw-ref reads
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    # tests/test_live_bee.py drives recordstore's BeeBytesStore directly; it
    # skips without BEE_API/BEE_BATCH, but the import must resolve to collect.
    "recordstore[bee,stamps]",
]
# The `swarm:NAME` store for `odag-fs --store` goes through ontodag's CLI
# backend, which reaches a Bee node via recordstore's BeeBytesStore and
# resolves `bee_batch = auto` through swarmfs. ontodag's base install carries
# none of that since it dropped its third-party dependencies, so the swarm
# path has to be asked for by name — without this extra, every command on a
# swarm store fails at store-open rather than at install.
swarm = ["ontodag[swarm]"]
dev = ["ontodag-fs[test]"] # back-compat alias; [test] is the stack-wide name

[project.entry-points."fsspec.specs"]
ontodag = "ontodag_fs.fs:OntoDAGFileSystem"

[project.scripts]
odag-fs = "ontodag_fs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fuse: FUSE integration tests (require libfuse; skipped by default)",
]
addopts = "-m 'not fuse'"

[project.urls]
Homepage = "https://github.com/petfold/ontodag-fs"
Repository = "https://github.com/petfold/ontodag-fs"
Issues = "https://github.com/petfold/ontodag-fs/issues"
